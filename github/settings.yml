# Source of truth for GitHub repo settings applied across every isejalabs repo.
# Read and applied by ../.github/workflows/enforce-repo-settings.yml in this repo, on a
# weekly schedule and via manual workflow_dispatch. See README.md in this directory for
# setup (the ORG_SETTINGS_TOKEN secret) and rationale.
#
# (The github/safe-settings GitHub App (https://github.com/github/safe-settings) covers
# a lot more than this -- branch protection, labels, team permissions -- but requires
# hosting a standalone Probot app. Revisit it if this org's settings-as-code needs ever
# grow beyond repo-level flags.)

repository:
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
